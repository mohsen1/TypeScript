# Clippy configuration for TypeScript Rust port
# See: https://rust-lang.github.io/rust-clippy/master/index.html

# Cognitive complexity threshold
cognitive-complexity-threshold = 30

# Maximum lines in a function
too-many-lines-threshold = 200

# Maximum number of arguments
too-many-arguments-threshold = 8

# Allow certain patterns common in parsers and compilers
avoid-breaking-exported-api = true

# Type complexity threshold
type-complexity-threshold = 300

# Maximum struct booleans
max-struct-bools = 5

# Large error threshold for result types
large-error-threshold = 256

# Maximum size of enum variant
enum-variant-size-threshold = 200
