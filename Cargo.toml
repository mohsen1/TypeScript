[workspace]
resolver = "2"
members = [
    "crates/zang_core",
    "crates/zang_parser",
    "crates/zang_checker",
    "crates/zang_wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/anthropics/typescript-rust"

[workspace.dependencies]
# Core data structures
bumpalo = { version = "3.14", features = ["collections"] }
dashmap = "5.5"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Parallelism
rayon = "1.8"

# WASM support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# String interning
string_cache = "0.8"
rustc-hash = "1.1"

# Testing
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.release-wasm]
inherits = "release"
opt-level = "s"
