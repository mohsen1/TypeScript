[package]
name = "ts-parser"
version = "0.1.0"
edition = "2021"
description = "High-performance TypeScript parser with ThinNode AST"

[lib]
name = "ts_parser"
path = "src/parser/lib.rs"

[[bin]]
name = "ts-parser"
path = "src/parser/main.rs"

[dependencies]
bumpalo = "3.14"

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
