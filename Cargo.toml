[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/parser",
    "crates/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nicolo-ribaudo/nicolo-nicolo-nicolo"

[workspace.dependencies]
# Memory allocation
bumpalo = { version = "3.14", features = ["collections"] }

# Concurrent data structures
dashmap = "5.5"

# Parallelism
rayon = "1.8"
crossbeam = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File patterns
glob = "0.3"

# Path utilities
pathdiff = "0.2"

# WASM bindings
wasm-bindgen = "0.2"

# Workspace crates
tsrs-core = { path = "crates/core" }
tsrs-parser = { path = "crates/parser" }
tsrs-wasm = { path = "crates/wasm" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.release-wasm]
inherits = "release"
opt-level = "s"
